name: Update flake.lock

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: nix flake update
        run: nix flake update

      # A new flake-file or alejandra can render flake.nix differently, which
      # fails check-flake-file until flake.nix is regenerated.
      - name: Regenerate flake.nix
        run: |
          nix run .#write-flake
          nix flake lock

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-lock
          path: |
            flake.lock
            flake.nix

  check:
    needs: update
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flake-lock

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Not `nix flake check`: Determinate Nix's evaluates the Macs on Linux,
      # upstream Nix's evaluates the NixOS hosts on macOS, and either way
      # catppuccin's import-from-derivation needs the other platform's builder.
      - name: Build this system's checks
        shell: bash
        run: |
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix eval --json ".#checks.$system" --apply builtins.attrNames | jq -r --arg system "$system" '.[] | ".#checks.\($system).\(.)"' | xargs nix build -L --no-link

  commit:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flake-lock

      - uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: "ci(flake): bump the inputs [skip ci]"
          repo: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          file_pattern: flake.lock flake.nix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
